<header class="topbar">
  <nav class="langs" [attr.aria-label]="i18n.t('common.language')">
    @for (l of langs; track l.code) {
      <button type="button" class="ghost" [class.active]="i18n.lang() === l.code" [attr.aria-pressed]="i18n.lang() === l.code"
        [attr.lang]="l.code" [title]="l.name" (click)="i18n.lang.set(l.code)">{{ l.label }}</button>
    }
  </nav>
</header>

<main>
  @switch (test.step()) {
    @case ('intro') { <app-intro /> }
    @case ('profile') { <app-profile /> }
    @case ('cards') { <app-cards /> }
    @case ('reflection') { <app-reflection /> }
    @case ('analyzing') {
      <section class="panel center analyzing">
        <div class="ink" aria-hidden="true"></div>
        <h2>{{ i18n.t('analyzing.title') }}</h2>
        <p class="muted">{{ i18n.t('analyzing.subtitle') }}</p>
      </section>
    }
    @case ('results') { <app-results /> }
  }
</main>

<footer>
  <button class="ghost" type="button" (click)="showPrivacy.set(!showPrivacy())">
    {{ showPrivacy() ? i18n.t('footer.hidePrivacy') : i18n.t('footer.showPrivacy') }}
  </button>
  @if (showPrivacy()) {
    <div class="panel"><app-privacy-notice /></div>
  }
</footer>
